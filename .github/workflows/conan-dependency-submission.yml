name: Conan Dependency Submission

on:
  push:
    branches: [master]
    paths:
      - 'conanfile.py'
      - '.github/workflows/conan-dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install conan
      - uses: zenden2k/conan-dependency-submission@fix-user-channel
        with:
          conanfile: conanfile.py
          conan-version: 2.27.1